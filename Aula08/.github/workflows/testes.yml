name: Pipeline de Testes Automatizados

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  executar-testes:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Aula08

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Aula08/package-lock.json

      - name: 3. Instalar dependências
        run: npm ci

      - name: 4. Executar testes com Jest e cobertura
        run: npm test -- --coverage